name: Deploy

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install ".[dev]"

      - name: Run tests
        run: pytest

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform Init
        working-directory: terraform
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="region=${{ secrets.AWS_REGION }}" \
            -backend-config="dynamodb_table=terraform-locks"

      - name: Update IAM permissions
        working-directory: terraform
        run: |
          terraform apply -auto-approve \
            -target=aws_iam_policy.github_actions

      - name: Ensure ECR exists
        working-directory: terraform
        run: |
          terraform apply -auto-approve \
            -target=aws_ecr_repository.windtrend \
            -target=aws_ecr_lifecycle_policy.windtrend \
            -target=aws_ecr_repository_policy.windtrend

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/windtrend:$IMAGE_TAG .
          docker push $ECR_REGISTRY/windtrend:$IMAGE_TAG
          echo "IMAGE_URI=$ECR_REGISTRY/windtrend:$IMAGE_TAG" >> $GITHUB_ENV

      - name: Terraform Apply
        working-directory: terraform
        run: |
          terraform apply -auto-approve \
            -var="image_uri=${{ env.IMAGE_URI }}"
